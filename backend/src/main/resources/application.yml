server:
  port: ${PORT:8080}

spring:
  application:
    name: stageflow-backend

  datasource:
    # Por padrão, se não passar SPRING_DATASOURCE_URL, roda H2 em memória para testes no IntelliJ sem travar
    # Na nuvem (Supabase/Render/Neon), basta setar SPRING_DATASOURCE_URL=jdbc:postgresql://host:port/database
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:stageflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

stageflow:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d7e1b3a5f6e8d0c2b4a6f8e0d2b4a6f8e0d2b4a6f8e0d2b4a6f8e0d2b}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas

  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "https://mauricio-g-oliveira.github.io"
